name: Deploy Portfolio

on:
  push:
    branches:
      - main

concurrency: deploy

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  docker:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            utkarsh694208607/portfolio:${{ github.sha }}
            utkarsh694208607/portfolio:latest

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pipx install ansible-core==2.21.4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/portfolio-key
          chmod 600 ~/.ssh/portfolio-key

      - name: Set up known hosts
        run: |
          mkdir -p ~/.ssh
          cp ansible/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook portfolio.yml -e image_tag=${{ github.sha }}

      - name: Smoke test
        run: |
          curl -sS -o /dev/null \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            https://utkarshtyagi.in