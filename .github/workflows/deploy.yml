  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pipx install ansible-core==2.21.4

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/portfolio-key
          chmod 600 ~/.ssh/portfolio-key

      - name: Set up known hosts
        run: |
          mkdir -p ~/.ssh
          cp ansible/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with Ansible
        working-directory: ansible
        run: |
          ansible-playbook portfolio.yml -e image_tag=${{ github.sha }}

      - name: Smoke test
        run: |
          curl -sS -o /dev/null \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            https://utkarshtyagi.in